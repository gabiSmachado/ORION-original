{{- if and (not .Values.qwen.existingSecret) .Values.qwen.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-client.fullname" . }}-qwen
  labels:
    {{- include "mcp-client.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.qwen.secretKey }}: {{ .Values.qwen.apiKey | b64enc }}
{{- end }}